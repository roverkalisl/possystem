{% extends "base.html" %}

{% block title %}Add Labour Allocation{% endblock %}

{% block content %}
<div class="card p-3 p-md-4 compact-card-sm">
    <div class="app-card-header">
        <h4 class="app-page-title">Daily Labour Allocation</h4>
        <div>
            <a href="{% url 'labour_allocation_list' %}" class="btn btn-secondary btn-sm">Back</a>
        </div>
    </div>

    <form method="POST">
        {% csrf_token %}
        <div class="row g-2">
            <div class="col-md-6">
                <label class="form-label">Employee</label>
                <select name="employee" class="form-select form-select-sm" required>
                    <option value="">Select Employee</option>
                    {% for employee in employees %}
                    <option value="{{ employee.id }}">{{ employee.full_name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Project</label>
                <select name="project" class="form-select form-select-sm" required>
                    <option value="">Select Project</option>
                    {% for project in projects %}
                    <option value="{{ project.id }}">{{ project.project_id }} - {{ project.project_name }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="row g-2 mt-2">
            <div class="col-md-4">
                <label class="form-label">Date</label>
                <input type="date" name="date" class="form-control form-control-sm" value="{% now 'Y-m-d' %}">
            </div>
            <div class="col-md-4">
                <label class="form-label">Supervisor</label>
                <select name="supervisor" class="form-select form-select-sm">
                    <option value="">Select Supervisor</option>
                    {% for employee in employees %}
                    <option value="{{ employee.id }}">{{ employee.full_name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">Work Type</label>
                <input type="text" name="work_type" class="form-control form-control-sm" placeholder="Mason / Engineer / Labour">
            </div>
        </div>

        <div class="row g-2 mt-2">
            <div class="col-md-2">
                <label class="form-label">Working Hours</label>
                <input type="number" step="0.5" name="working_hours" class="form-control form-control-sm" value="8">
            </div>
            <div class="col-md-2">
                <label class="form-label">OT Hours</label>
                <input type="number" step="0.5" name="ot_hours" class="form-control form-control-sm" value="0">
            </div>
            <div class="col-md-2">
                <label class="form-label">Daily Rate</label>
                <input type="number" step="0.01" name="daily_rate" class="form-control form-control-sm" value="0">
            </div>
            <div class="col-md-2">
                <label class="form-label">OT Rate</label>
                <input type="number" step="0.01" name="ot_rate" class="form-control form-control-sm" value="0">
            </div>
            <div class="col-md-2">
                <label class="form-label">Attendance</label>
                <select name="attendance_status" class="form-select form-select-sm">
                    <option value="present">Present</option>
                    <option value="absent">Absent</option>
                    <option value="half_day">Half Day</option>
                    <option value="leave">Leave</option>
                    <option value="holiday">Holiday</option>
                    <option value="late">Late</option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label">Remarks</label>
                <input type="text" name="remarks" class="form-control form-control-sm" placeholder="Optional">
            </div>
        </div>

        <div class="mt-3">
            <button class="btn btn-primary btn-sm w-100">Save Allocation</button>
        </div>
    </form>
</div>
{% endblock %}
