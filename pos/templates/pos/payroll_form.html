{% extends 'base.html' %}
{% block title %}{% if payroll %}Edit Payroll{% else %}Add Payroll{% endif %}{% endblock %}
{% block page_title %}{% if payroll %}Edit Payroll{% else %}Add Payroll{% endif %}{% endblock %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Employee</label>
                    <select name="employee" class="form-select" required>
                        <option value="">Select Employee</option>
                        {% for employee in employees %}
                        <option value="{{ employee.id }}" {% if payroll and payroll.employee_id == employee.id %}selected{% endif %}>{{ employee.full_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Project</label>
                    <select name="project" class="form-select">
                        <option value="">Select Project</option>
                        {% for project in projects %}
                        <option value="{{ project.id }}" {% if payroll and payroll.project_id == project.id %}selected{% endif %}>{{ project.project_id }} - {{ project.project_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Supervisor / Site Supervisor</label>
                    <select name="supervisor" class="form-select">
                        <option value="">Select Supervisor</option>
                        {% for employee in employees %}
                        <option value="{{ employee.id }}" {% if payroll and payroll.supervisor_id == employee.id %}selected{% endif %}>{{ employee.full_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Department</label>
                    <input type="text" name="department" class="form-control" value="{{ payroll.department|default:'' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Employee Category</label>
                    <input type="text" name="employee_category" class="form-control" value="{{ payroll.employee_category|default:'' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Designation</label>
                    <input type="text" name="designation" class="form-control" value="{{ payroll.designation|default:'' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Salary Period</label>
                    <select name="salary_period" class="form-select">
                        <option value="monthly" {% if payroll and payroll.salary_period == 'monthly' %}selected{% endif %}>Monthly</option>
                        <option value="weekly" {% if payroll and payroll.salary_period == 'weekly' %}selected{% endif %}>Weekly</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Salary Month</label>
                    <input type="month" name="salary_month" class="form-control" value="{% if payroll and payroll.salary_month %}{{ payroll.salary_month|date:'Y-m' }}{% endif %}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Working Days</label>
                    <input type="number" step="0.01" name="working_days" class="form-control" value="{{ payroll.working_days|default:'' }}">
                </div>
                <div class="col-md-3">
                    <label class="form-label">OT Hours</label>
                    <input type="number" step="0.01" name="ot_hours" class="form-control" value="{{ payroll.ot_hours|default:'' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Gross Salary</label>
                    <input type="number" step="0.01" name="gross_salary" class="form-control" value="{{ payroll.gross_salary|default:'' }}" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Labour GL Account</label>
                    <select name="labour_gl_account" class="form-select">
                        <option value="">Select GL</option>
                        {% for gl in gl_accounts %}
                        <option value="{{ gl.id }}" {% if payroll and payroll.labour_gl_account_id == gl.id %}selected{% endif %}>{{ gl.gl_code }} - {{ gl.gl_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Salary Payable GL</label>
                    <select name="salary_payable_gl_account" class="form-select">
                        <option value="">Select GL</option>
                        {% for gl in gl_accounts %}
                        <option value="{{ gl.id }}" {% if payroll and payroll.salary_payable_gl_account_id == gl.id %}selected{% endif %}>{{ gl.gl_code }} - {{ gl.gl_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Bank / Cash GL</label>
                    <select name="bank_gl_account" class="form-select">
                        <option value="">Select GL</option>
                        {% for gl in gl_accounts %}
                        <option value="{{ gl.id }}" {% if payroll and payroll.bank_gl_account_id == gl.id %}selected{% endif %}>{{ gl.gl_code }} - {{ gl.gl_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-12">
                    <label class="form-label">Notes</label>
                    <textarea name="description" class="form-control" rows="3">{{ payroll.description|default:'' }}</textarea>
                </div>
            </div>
            <div class="mt-4 d-flex gap-2">
                <button type="submit" class="btn btn-primary">Save Payroll</button>
                <a href="{% url 'payroll_list' %}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
